version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: harvestpredict-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: harvestpredict
    networks:
      - harvestpredict-network

  ml-service:
    build: ./ml-service
    container_name: harvestpredict-ml-service
    ports:
      - "8000:8000"
    environment:
      ML_MODEL_DIR: /app/models
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    networks:
      - harvestpredict-network

  server:
    build: ./server
    container_name: harvestpredict-server
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/harvestpredict
      JWT_SECRET: change_me_in_production
      ML_SERVICE_URL: http://ml-service:8000
      NODE_ENV: production
    depends_on:
      - mongodb
      - ml-service
    networks:
      - harvestpredict-network

  client:
    build: ./client
    container_name: harvestpredict-client
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - harvestpredict-network

volumes:
  mongo-data:
    driver: local

networks:
  harvestpredict-network:
    driver: bridge
